# Spring Boot config. These key=value pairs override framework defaults.
# You never need most of them until you do — start with just what's below.

# Give the app a name (shows up in logs).
spring.application.name=llm-eval-harness

# --- Database (PostgreSQL in Docker) ---
# Start the database first: `docker compose up -d` (see docker-compose.yml).
# Unlike the old in-memory H2, Postgres is a separate server process, so data
# survives app restarts. (Tests still use in-memory H2 — see EvalControllerTest.)
#
# A JDBC URL reads: jdbc:<driver>://<host>:<port>/<database name>
# The username and password must match what docker-compose.yml created.
spring.datasource.url=jdbc:postgresql://localhost:5432/evals
spring.datasource.username=evals
spring.datasource.password=evals

# --- JPA / Hibernate ---
# `update`: on startup, create any missing tables/columns from our @Entity
# classes, but never drop existing data. (The old `create-drop` wiped every
# table on shutdown — pointless once the DB is real.) In production you'd use
# `validate` and manage schema changes with Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
# Log the generated SQL so we can see what Hibernate is doing behind the scenes.
# Great learning aid; turn OFF once you know what the framework is up to.
spring.jpa.show-sql=true

# --- LLM eval config (Evening 2) ---
# Which model to evaluate. Defaults to Claude Opus 5. Point it at a cheaper,
# faster model (e.g. claude-haiku-4-5) while you iterate — the whole point of an
# eval harness is that the model under test is a knob you can turn.
anthropic.model=claude-haiku-5-5

# System prompt sent with every test case. Asking for terse answers keeps the
# "contains" scorer predictable.
eval.system-prompt=Answer as concisely as possible, ideally with just the answer and nothing else.
