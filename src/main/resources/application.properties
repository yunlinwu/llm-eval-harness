# Spring Boot config. These key=value pairs override framework defaults.
# You never need most of them until you do — start with just what's below.

# Give the app a name (shows up in logs).
spring.application.name=llm-eval-harness

# --- Database (H2 in-memory) ---
# H2 auto-configures out-of-the-box, so the ONLY thing we opt into here is
# leaving the H2 web console enabled at http://localhost:8080/h2-console.
# It's a browser UI you can use to poke at the DB directly during development.
# Turn this OFF in production (auth is trivially bypassable) — but for local
# learning it's very handy.
spring.h2.console.enabled=true

# Datasource URL: "jdbc:h2:mem:evals" means "an in-memory H2 database named evals".
# In-memory means the DB lives inside the JVM and disappears on restart.
# Perfect for a learning project; obviously wrong for real data.
spring.datasource.url=jdbc:h2:mem:evals
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
# On startup, drop and recreate the schema from our @Entity classes.
# In production you switch to `validate` and manage schema with Flyway/Liquibase,
# but `create-drop` is the "just make it work" setting for early development.
spring.jpa.hibernate.ddl-auto=create-drop
# Log the generated SQL so we can see what Hibernate is doing behind the scenes.
# Great learning aid; turn OFF once you know what the framework is up to.
spring.jpa.show-sql=true
